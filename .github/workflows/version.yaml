---
name: Version

# Checks the app version: X.Y.Z-N, X.Y.Z is the bundled ControllerX and it's
# newer than every release for Home Assistant. See "Versioning" in README.md.
# The release workflows run the same check before releasing.
# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt
      - name: Test the version check
        run: python -m unittest discover -s .github/scripts
      - name: Check version
        run: python .github/scripts/check_version.py
