---
name: ControllerX
# Version is the bundled ControllerX version, "-<n>" for app-only releases
# (ignored when downloading ControllerX). Set by the release workflows.
version: 5.2.5
slug: controllerx
description: >-
  Controller-based automations for your home devices, running on its own
  AppDaemon instance with ControllerX preinstalled
url: https://github.com/xaviml/controllerx-app
image: ghcr.io/xaviml/controllerx-app/{arch}
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
services:
  - mqtt:want
map:
  - addon_config:rw
options:
  python_packages: []
  production_mode: false
  mqtt_enabled: false
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  python_packages:
    - str
  production_mode: bool
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
