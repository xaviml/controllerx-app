---
# ControllerX apps. Changes to this file are applied without restarting.
#
# Each app links one controller with one or more devices, for example:
#
# livingroom_controller:
#   module: controllerx
#   class: E1810Controller
#   controller: livingroom_controller
#   integration:
#     name: z2m
#     listen_to: mqtt
#   light: light.livingroom
#
# Find the class for your controller and the integration options in:
#   https://xaviml.github.io/controllerx/controllers
#   https://xaviml.github.io/controllerx/start/configuration
#   https://xaviml.github.io/controllerx/start/integrations
#
# You can also split your apps into several YAML files in this folder.
# Do not edit the "controllerx" folder, it is replaced on every app start.
